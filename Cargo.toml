[package]
name = "cosmic-snap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small screenshot annotator for the COSMIC desktop"
repository = "https://github.com/phoscoder/cosmic-snap"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wayland", "glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
ab_glyph = "0.2"
notify-rust = { version = "4.19.0", default-features = false, features = ["z"] }

[profile.release]
opt-level = 3
lto = "thin"
